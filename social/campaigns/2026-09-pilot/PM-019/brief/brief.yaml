campaign:
  id: "2026-09-pilot-pm-019"
  object_id: "PM-019"
  phase: "pilot"
  status: "ready-for-review"
  owner_approval_required: true

object:
  name: "Slide Projector Sharpener"
  name_ko: "슬라이드 영사기 연필깎이"
  source_of_truth:
    - "src/catalog.js"
    - "public/images/objects/pm-019-slide-projector-sharpener/product.json"
  product_state: "concept-render-not-produced"

hypothesis:
  statement: "익숙한 슬라이드 영사기의 초점 휠을 연필깎이 크랭크로 바꾼 장면은 2초 안에 기능을 이해시키고, 저장·공유보다 먼저 구체적인 시제품 의향 댓글을 만든다."
  primary_audience: "한국의 제품디자인, 문구, 아날로그 카메라와 빈티지 전자제품 관심층"
  single_variable: "첫 1초 동작 훅"
  hook_a: "영사기인 줄 알았는데, 연필깎이입니다. / It looks like a projector. It sharpens pencils."
  hook_b: "초점을 돌리면 연필이 깎입니다. / Turn the focus. Sharpen the point."
  selected_hook: "hook_b"

disclosure:
  persistent: "CONCEPT RENDER · NOT YET PRODUCED / 콘셉트 렌더 · 아직 제작되지 않음"
  motion: "MOTION VISUALIZATION / 동작 시각화"
  final_question: "실제로 만들어볼까요? / Should we prototype this?"

content:
  reveal_reel:
    platform: "instagram"
    duration_seconds: 9
    aspect_ratio: "9:16"
    source_roles:
      - "sharpening-action"
      - "gear-cutaway"
      - "color-lineup"
    timeline:
      - "0.0-3.2: pencil and crank action with hook B"
      - "3.2-5.9: gear and cutter cutaway"
      - "5.9-9.0: color lineup and prototype question"
  gesture_loop:
    platform: "instagram,x"
    duration_seconds: 6
    source_roles:
      - "sharpening-action"
      - "gear-cutaway"
      - "color-lineup"
    loop_action: "action hook, mechanism, color vote"
  optional_carousel:
    platform: "instagram"
    condition: "첫 공개에서 저장, 공유, 색상 응답 중 하나가 확인된 경우에만 제작"
    size: "1080x1350"
    slides:
      - "reveal"
      - "crank action"
      - "gear mechanism"
      - "shavings drawer"
      - "color vote"
  x_post:
    platform: "x"
    format: "short claim + question + 6-second loop"
    avoid: "copying the Instagram caption verbatim"

proposed_schedule:
  timezone: "Asia/Seoul"
  status: "recommended-not-published"
  posts:
    - slot: "instagram-reveal"
      at: "2026-09-04T19:30:00+09:00"
    - slot: "x-reveal"
      at: "2026-09-04T19:45:00+09:00"
  rationale: "PM-001의 첫 24시간 신호를 확보한 뒤 약 30시간 간격으로 다른 형태의 작품을 공개해 초기 계정의 흐름을 유지하고 작품 반응을 비교한다."

measurement:
  checkpoints_hours:
    - 1
    - 4
    - 12
    - 24
    - 72
    - 168
  primary_signals:
    - "saves"
    - "shares"
    - "meaningful_comments"
    - "profile_visits"
    - "follows"
    - "explicit_prototype_intent"
  comparison: "recent median of comparable posts; if unavailable, treat this campaign as baseline"
  insufficient_sample: "Do not judge the object from a single low-reach post. Retest one hook once."
  paid_media: "blocked until the four-post organic sprint is complete and one clear winner appears"

approval_gates:
  reveal: "pending"
  copy: "pending"
  design: "pending"
  video: "pending"
  publish: "blocked"
  paid_media: "blocked"
